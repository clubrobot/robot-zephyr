CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_SENSOR=y

# Enable motors support
CONFIG_MOTORS=y
CONFIG_DRV8844=y

# Required in order to boot the beacon sensor
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BEACON_SENSOR=y

CONFIG_LOG=y
CONFIG_LOG_INFO_COLOR_GREEN=y

# To be able to print float
CONFIG_CBPRINTF_FP_SUPPORT=y

#CONFIG_LOG_MODE_IMMEDIATE=y
