name: Build Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build the application
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.30.0

    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
      CCACHE_DIR: ~/.cache/ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: Zephyr   # checked out into a subfolder so west can manage the workspace

      - name: Restore west workspace
        uses: actions/cache@v4
        with:
          path: |
            .west
            zephyr
            modules
            bootloader
            tools
            ~/.cache/ccache
          key: zephyr-${{ runner.os }}-${{ hashFiles('Zephyr/west.yml') }}
          restore-keys: |
            zephyr-${{ runner.os }}-

      - name: Initialize west workspace
        run: |
          if [ ! -f .west/config ]; then
            west init -l Zephyr
          fi
          west update

      - name: Export Zephyr CMake package
        run: |
          west zephyr-export

      - name: Build application
        run: |
          west build \
            --pristine \
            --board board_2026 \
            Zephyr/app
