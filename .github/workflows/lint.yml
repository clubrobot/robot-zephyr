name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: C/C++ lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-tidy clang-format

      - name: Check C and C++ formatting
        run: |
          git ls-files '*.c' '*.h' '*.cpp' '*.hpp' '*.cc' '*.cxx' |
            xargs clang-format --dry-run --Werror --style=file

      - name: Run clang-tidy
        run: |
          git ls-files '*.c' '*.h' '*.cpp' '*.hpp' '*.cc' '*.cxx' |
            xargs clang-tidy --config-file=.clang-tidy --quiet
