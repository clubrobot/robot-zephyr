description: |
  Binding pour le DRV8844 contrôlant les moteurs.
  
  
compatible: "drv8844"
include: "base.yaml"

properties:
  sleep-gpios:
    type: phandle-array
    required: true
    description: Le pin de sleep du driver

  fault-gpios:
    type: phandle-array
    required: true
    description: Le pin de fault du driver

  channel-count:
    type: int
    required: false
    default: 1
    description: The number of active channel

child-binding:
  description: Motor channel configuration
  properties:
    reg:
      type: int
      required: true
      description: Channel index in the parent motor driver node

    enable-gpios:
      type: phandle-array
      required: true
      description: Enable GPIO for this motor channel

    pwms:
      type: phandle-array
      required: true
      description: PWM output for this motor channel

    dir-gpios:
      type: phandle-array
      required: true
      description: Direction GPIO for this motor channel


