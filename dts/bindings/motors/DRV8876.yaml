description: |
  Binding pour le DRV8876 contrôlant les moteurs.
  
  
compatible: "drv8876"
include: "base.yaml"

properties:
  gpio-pwm:
    type: phandle
    required: true
    description: Le pin PWM du driver

  gpio-dir:
    type: phandle
    required: true
    description: Le pin de direction du driver

  gpio-sleep:
    type: phandle
    required: true
    description: Le pin de sleep du driver

  gpio-fault:
    type: phandle
    required: true
    description: Le pin de fault du driver